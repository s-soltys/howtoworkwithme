# PostgreSQL configuration per research.md requirements
# Development and test use PostgreSQL for array support and GIN indexes
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>

development:
  <<: *default
  database: howtoworkwithme_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: howtoworkwithme_test


# Production uses PostgreSQL with multiple databases for cache, queue, and cable
production:
  primary:
    <<: *default
    database: howtoworkwithme_production
  cache:
    <<: *default
    database: howtoworkwithme_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: howtoworkwithme_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: howtoworkwithme_production_cable
    migrations_paths: db/cable_migrate
